name: Build

on:
  workflow_dispatch:
  pull_request:

jobs:
  build-server:
    runs-on: ubuntu-latest
    name: Build Server
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Maven Build Server
        run: mvn package -f Server/pom.xml  # Явно указываем POM-файл
        working-directory: Server  # Указываем рабочую директорию

      - id: jacoco-server
        uses: madrapps/jacoco-report@v1.6.1
        if: ( github.event_name != 'workflow_dispatch' )
        with:
          paths: ${{ github.workspace }}/Server/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 30
          min-coverage-changed-files: 30
          title: Code Coverage (Server)
          update-comment: true

  build-parcer:
    runs-on: ubuntu-latest
    name: Build Parcer
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Maven Build Parcer
        run: mvn package -f Parcer/pom.xml
        working-directory: Parcer

      - id: jacoco-parcer
        uses: madrapps/jacoco-report@v1.6.1
        if: ( github.event_name != 'workflow_dispatch' )
        with:
          paths: ${{ github.workspace }}/Parcer/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 30
          min-coverage-changed-files: 30
          title: Code Coverage (Parcer)
          update-comment: true

  checkstyle-server:
    name: Checkstyle Server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Maven Checkstyle Server
        run: mvn checkstyle:check modernizer:modernizer spotbugs:check pmd:check pmd:cpd-check -f Server/pom.xml
        working-directory: Server

  checkstyle-parcer:
    name: Checkstyle Parcer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      - name: Maven Checkstyle Parcer
        run: mvn checkstyle:check modernizer:modernizer spotbugs:check pmd:check pmd:cpd-check -f Parcer/pom.xml
        working-directory: Parcer
